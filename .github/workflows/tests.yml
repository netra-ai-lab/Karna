# Fast tests on every push and pull request (no published models needed: the API tests export
# a tiny random model with PyTorch, so CI installs the CPU build of torch for them).
#
# A manual run (Actions → tests → Run workflow) can also run the slow tests, which download
# the published models and compare their text on tests/golden/ with golden.json.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the real-model tests (pytest --slow)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cpu,server,dev]" safetensors onnx onnxscript tqdm

      - name: Cache the models
        if: inputs.slow
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('karna/models.py') }}

      - name: Test
        run: pytest tests -q ${{ inputs.slow && '--slow' || '' }}
        env:
          KARNA_DEVICE: cpu

      - name: Check the package stays small (no model files)
        run: rm -rf build dist && python -m build && python scripts/check_dist.py

# karna-large v2: the 1B chain on the v2 recipe of configs/base_v2/ (full-pass Stage 1, 960 h of
# LibriSpeech, slower sparsity ramp, longer recovery), from configs/large/ for the 1B-specific settings.
# omniASR CTC-1B (karna-large, 48 layers, dim 1280)
# Stage 2: structured pruning of the fine-tuned 1B to 80% sparsity (DPHuBERT / DiariZen recipe).
#   student = teacher = `init` (the Stage 1 model)
#   loss    = mean over distill_layers of (L1 - cosine) to the frozen teacher
#           + lambda1 (s - t) + lambda2 (s - t)^2,   s = expected sparsity, t ramps 0 -> 0.8
# Gates on attention heads and FFN intermediate units; conv channels are left out (docs/DESIGN.md).
stage: prune
run_dir: runs/large_v2/stage2_prune_s80
init: runs/large_v2/stage1_finetune/teacher.pt
teacher: runs/large_v2/stage1_finetune/teacher.pt
seed: 1234

model:
  pruning_units: head,interm
  precision: offload          # bf16 1B on the GPU, fp32 master + AdamW moments in CPU RAM
  gradient_checkpointing: true
  freeze_feature_extractor: true   # conv channels are not pruned; frozen = no conv activations kept for backward
  layerdrop: 0.0
  ffn_dropout: 0.0

optim:
  max_steps: 12000
  grad_accum: 1
  lr: 2.0e-4                  # DiariZen distill_lr
  gate_lr: 2.0e-2             # DiariZen reg_lr (log_alpha and the multipliers)
  weight_decay: 0.0
  warmup_steps: 500
  decay_frac: 0.0
  max_grad_norm: 10.0

prune:
  target_sparsity: 0.8
  sparsity_warmup_frac: 0.5   # 6000 steps of linear ramp, then held (v1's 0.25 overshot to 83% at steps 4-5k, as base did)
  distill_layers: [0, 12, 24, 36, 48]   # every 12th of 48; 48 = after the final LayerNorm (what the CTC head reads)
  l1_weight: 1.0
  cos_weight: 1.0
  ctc_weight: 0.0
  mask_snapshots: false       # no masks/step_*.pt; gates live in latest.pt

data:
  libri_train: data/libri_train_960.jsonl   # + train-other-500: ~960 h of English instead of 464 h
  fleurs_km_units: data/fleurs_km_units.json
  fleurs_en_train: data/fleurs_en_train.jsonl
  fleurs_fraction: 0.2        # FLEURS = 20% of each language's audio (repeated); 1-2% at natural share
                              # let FLEURS-km dev CER climb 10.7 -> 13.1% in the first 1k steps of stage 1
  en_fraction: 0.5
  max_batch_seconds: 160
  max_batch_size: 32
  num_workers: 1              # the offloaded 1B leaves little host RAM; 2 workers (4.7 GB) + a 7.8 GB save got the
                              # session killed by systemd-oomd on 2026-11-18. 1 worker makes ~20 batches/s, the trainer takes one per ~5 s

eval:
  every_steps: 500
  sets:
    ddd_dev: {manifest: data/ddd_dev.jsonl, limit: 400}
    libri_dev: {manifest: data/libri_dev-clean.jsonl, limit: 400}
    fleurs_km_dev: {manifest: data/fleurs_km_dev.jsonl, limit: 326}
    fleurs_en_dev: {manifest: data/fleurs_en_dev.jsonl, limit: 400}
  select: [ddd_dev.cer, libri_dev.wer, fleurs_km_dev.cer, fleurs_en_dev.wer]
  select_after_step: 6000     # only once the sparsity target is reached

save:
  every_steps: 250
  every_minutes: 45
  best: false                 # keep only latest.pt (one checkpoint per run)
  moments_dtype: bf16         # latest.pt ~8 GB instead of ~12 GB (data disk is nearly full)

# sota-large v2: the 1B re-fine-tuned on the full v2 mix; stages 2-3 follow in this folder.
# omniASR CTC-1B (sota-large, 48 layers, dim 1280)
# Stage 1: CTC fine-tune of the full 1B on DDD + FLEURS-km / LibriSpeech 960 h + FLEURS-en, for one full
# pass over the mix (~62k steps, as configs/base_v2/stage1_finetune.yaml; v1 ran 6k).
# The result (teacher.pt) is both the starting point and the teacher of the pruning
# (fine-tune before structured pruning, arXiv 2505.24111).
stage: finetune
run_dir: runs/large_v2/stage1_finetune
init: ${SOTA_MODELS_DIR}/omniASR-CTC-1B/omniASR-CTC-1B.sota.pt
seed: 1234

model:
  precision: offload          # bf16 1B on the GPU, fp32 master + AdamW moments in CPU RAM
  gradient_checkpointing: true
  freeze_feature_extractor: true
  layerdrop: 0.05
  ffn_dropout: 0.1

optim:
  max_steps: 62000
  grad_accum: 1
  lr: 1.0e-5                  # encoder
  head_lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  decay_frac: 0.5
  final_lr_scale: 0.05
  max_grad_norm: 5.0

data:
  libri_train: data/libri_train_960.jsonl   # + train-other-500: ~960 h of English instead of 464 h
  fleurs_km_units: data/fleurs_km_units.json
  fleurs_en_train: data/fleurs_en_train.jsonl
  fleurs_fraction: 0.2        # FLEURS = 20% of each language's audio (repeated); 1-2% at natural share
                              # let FLEURS-km dev CER climb 10.7 -> 13.1% in the first 1k steps of stage 1
  en_fraction: 0.5
  max_batch_seconds: 160
  max_batch_size: 32
  num_workers: 1              # the offloaded 1B leaves little host RAM; 2 workers (4.7 GB) + a 7.8 GB save got the
                              # session killed by systemd-oomd on 2026-11-18. 1 worker makes ~20 batches/s, the trainer takes one per ~5 s

eval:
  every_steps: 2000
  at_start: false
  sets:
    ddd_dev: {manifest: data/ddd_dev.jsonl, limit: 400}
    libri_dev: {manifest: data/libri_dev-clean.jsonl, limit: 400}
    fleurs_km_dev: {manifest: data/fleurs_km_dev.jsonl, limit: 326}
    fleurs_en_dev: {manifest: data/fleurs_en_dev.jsonl, limit: 400}
  select: [ddd_dev.cer, libri_dev.wer, fleurs_km_dev.cer, fleurs_en_dev.wer]

save:
  every_steps: 1000            # a 62k-step run; every_minutes still bounds the loss on a crash
  every_minutes: 45
  best: false                 # keep only latest.pt (one checkpoint per run)
  moments_dtype: bf16

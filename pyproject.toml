[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-karna"
version = "1.0.0"
description = "Compact Khmer and English speech recognition on ONNX Runtime: Omnilingual ASR CTC models structurally pruned to 80% sparsity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nhem Darayut", email = "darayutnhem009@gmail.com" }]
keywords = ["speech-recognition", "asr", "khmer", "english", "ctc", "pruning", "onnx", "omnilingual-asr"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# No PyTorch: the models run on ONNX Runtime, which comes through exactly one of the
# cpu / gpu extras (the two builds conflict). Training lives in training/ (its own package).
dependencies = [
    "numpy",
    "soundfile",
    "soxr",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
gpu = ["onnxruntime-gpu>=1.20"]
server = ["fastapi", "uvicorn[standard]", "python-multipart"]
full = ["netra-karna[cpu,server]"]
dev = ["pytest", "httpx", "build"]

[project.scripts]
karna = "karna.cli:main"

[project.urls]
Repository = "https://github.com/netra-ai-lab/Karna"
"Model Download" = "https://huggingface.co/Netra-Lab/karna-base"
Docker = "https://github.com/netra-ai-lab/Karna/pkgs/container/karna"

[tool.setuptools.packages.find]
include = ["karna*"]

[tool.setuptools.package-data]
karna = ["vocab.json", "server/static/*", "server/static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "training/tests"]
pythonpath = [".", "training"]
addopts = "-q"
markers = ["slow: needs the published models (run with --slow)"]
